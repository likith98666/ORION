<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Obsidian substrate with fine border -->
  <rect width="32" height="32" rx="4" fill="#080A0C"/>
  <rect width="32" height="32" rx="4" stroke="#293137" stroke-width="1"/>

  <!-- Orbital coordinate system -->
  <ellipse cx="16" cy="16" rx="12" ry="5.5" transform="rotate(-28 16 16)" stroke="#527E9C" stroke-width="1.2" opacity="0.85"/>
  <circle cx="16" cy="16" r="9.5" stroke="#293137" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.6"/>

  <!-- Cardinal alignment ticks -->
  <line x1="16" y1="3" x2="16" y2="6.5" stroke="#B39A70" stroke-width="1" stroke-linecap="round"/>
  <line x1="16" y1="25.5" x2="16" y2="29" stroke="#B39A70" stroke-width="1" stroke-linecap="round"/>
  <line x1="3" y1="16" x2="6.5" y2="16" stroke="#B39A70" stroke-width="1" stroke-linecap="round"/>
  <line x1="25.5" y1="16" x2="29" y2="16" stroke="#B39A70" stroke-width="1" stroke-linecap="round"/>

  <!-- Orbital node -->
  <circle cx="25.2" cy="11.2" r="1.5" fill="#527E9C"/>

  <!-- Central geometric diamond nexus (ORION Core) -->
  <path d="M16 8.5L18.5 13.5L23.5 16L18.5 18.5L16 23.5L13.5 18.5L8.5 16L13.5 13.5Z" fill="#B39A70" stroke="#EEECE5" stroke-width="0.75" stroke-linejoin="round"/>
  <circle cx="16" cy="16" r="1.8" fill="#EEECE5"/>
</svg>

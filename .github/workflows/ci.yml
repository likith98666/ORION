name: ORION CI Quality Gates

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  quality-gates:
    name: Quality Gates (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.12" ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Quality Gate 1 - Ruff Linter
        run: |
          ruff check .
          ruff format --check .

      - name: Quality Gate 2 - Mypy Strict Type Check
        run: |
          mypy src

      - name: Quality Gate 3 - Pytest Test Suite
        run: |
          python -m pytest -q

      - name: Quality Gate 4 - Failure-Injection Recovery Suite
        run: |
          python -m pytest tests/integration/test_recovery_failure_injection.py -v

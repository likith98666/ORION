[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orion-ai-workforce"
version = "1.0.0"
description = "ORION — Autonomous AI Workforce for Knowledge and Engineering Work"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Likith" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.12,<0.14",
    "mypy>=1.15,<2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]
ignore = [
    "UP042",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = false
mypy_path = ["src"]
explicit_package_bases = true
files = ["src"]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true